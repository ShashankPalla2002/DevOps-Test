apiVersion: apps/v1

kind: Deployment

metadata:
  name: {{ .Values.name }}
  labels:
{{ .Values.labels | toYaml | indent 4 }}

spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
{{ .Values.labels | toYaml | indent 6 }}
  template:
    metadata:
      labels:
{{ .Values.labels | toYaml | indent 8 }} 
    spec:
      containers:
        - name: {{ .Values.name }}
          image: {{ .Value.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
{{ .Values.container.ports | toYaml | indent 12 }}
          env:
{{ .Values.container.env | toYaml | indent 12 }}